title: OpenTransmute
description: Decompose any codebase. Accumulate its ideas. Compose new systems from them.
remote_theme: just-the-docs/just-the-docs

logo: assets/images/logo-full.png

color_scheme: dark

search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 10

heading_anchors: true

aux_links:
  GitHub:
    - https://github.com/OpenTransmute/OpenTransmute

aux_links_new_tab: true

nav_sort: case_insensitive

footer_content: "OpenTransmute &mdash; MIT Licence"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

mermaid:
  # Version from jsDelivr (pick one from Mermaid releases)
  version: "9.1.3"
  # or use a local path instead of version:
  # path: "/assets/js/mermaid.min.js"
